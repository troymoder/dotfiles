[package]
name = "cabin-ec"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The Framework laptop's USB-C charger as its embedded controller sees it, on the system bus for the cabin panels"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
