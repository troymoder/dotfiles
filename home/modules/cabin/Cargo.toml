[package]
name = "cabin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Troy's quick settings for the COSMIC panel: one fixed layout, nothing to configure"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
futures = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }

[profile.release]
opt-level = 3
panic = "abort"
# Thin LTO re-optimised all of libcosmic once per binary: a one-line edit took
# 1m50s, 5s like this. package.nix turns incremental off for the clean build.
lto = false
incremental = true

# Same pins as cosmic-applets epoch-1.8.0, to match the installed panel.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
